{% macro flat_tree(grouped, empty="No milestones") %}
    <section class="terminal-tree">
        {% for day, milestones in grouped.items() %}
            <div class="terminal-tree-group">
                <div class="terminal-tree-year">{{ day }}</div>
                {% for milestone in milestones %}
                    <a class="terminal-tree-node"
                       data-keyboard-row
                       href="/milestones/{{ milestone.slug }}">
                        <span class="terminal-tree-branch">{% if loop.last %}└──{% else %}├──{% endif %}</span>
                        <span class="terminal-tree-label">{{ milestone.slug }}</span>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="terminal-tree-group">
                <div class="terminal-tree-year">{{ empty }}</div>
            </div>
        {% endfor %}
    </section>
{% endmacro %}
