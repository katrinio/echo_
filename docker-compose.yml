name: echo

services:
  echo-app:
    image: echo-app:latest
    build:
      context: .
      target: production
      args:
        ECHO_VERSION: ${ECHO_VERSION:?ECHO_VERSION must be set to a commit SHA, git tag, or build id}
    container_name: echo-app

    labels:
      com.katrin.logs.app: "echo"
      com.katrin.logs.environment: "production"

    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      ECHO_ENV: production
      ECHO_VERSION: ${ECHO_VERSION:?ECHO_VERSION must be set to a commit SHA, git tag, or build id}
      DATABASE_URL: sqlite:////app/echo.db
      ECHO_PASSWORD: ${ECHO_PASSWORD:?ECHO_PASSWORD must be set}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY must be set}
    volumes:
      - /home/katrin/data/echo/echo.db:/app/echo.db
